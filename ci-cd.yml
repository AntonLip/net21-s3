name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: S3FileApi.csproj

      - name: Restore dependencies
        run: dotnet restore S3FileApi.csproj

      - name: Build
        run: dotnet build S3FileApi.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test S3FileApi.csproj --configuration Release --no-build

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag s3fileapi:${{ github.sha }} .
